<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>鸟种分布 · 全国</title>
<link rel="preconnect" href="https://webapi.amap.com">
<link rel="dns-prefetch" href="https://webapi.amap.com">
<link rel="dns-prefetch" href="https://is.autonavi.com">
<link rel="dns-prefetch" href="https://cdn.bootcdn.net">
<link rel="dns-prefetch" href="https://s4.zstatic.net">
<style>
  html,body{height:100%;margin:0;overflow:hidden;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  #map{width:100%;height:100vh;height:100dvh;}
  #boot{position:fixed;inset:0;background:#fafafa;z-index:99999;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#999;font-size:14px;}
  #panel{position:fixed;left:12px;top:12px;z-index:9998;background:rgba(255,255,255,.96);border-radius:8px;padding:8px 10px;box-shadow:0 3px 14px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:7px;max-width:calc(100vw - 24px);}
  #panel .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  #speciesBox{position:relative;flex:0 1 200px;min-width:0;}
  #speciesBox input{font-size:13px;padding:5px 8px;border:1px solid #ddd;border-radius:5px;width:100%;box-sizing:border-box;}
  #speciesBox input:focus{outline:none;border-color:#90caf9;box-shadow:0 0 0 2px rgba(144,202,249,.35);}
  #suggest{display:none;position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid #e3e3e3;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.16);min-width:250px;max-height:228px;overflow-y:auto;z-index:10001;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  #suggest .item{padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #suggest .item.on,#suggest .item:hover{background:#e8f0fe;}
  #suggest .item.on{color:#0b57d0;}
  #suggest .lat{color:#aaa;font-size:11px;margin-left:6px;}
  #panel select{font-size:12px;padding:3px 6px;border:1px solid #ddd;border-radius:5px;background:#fff;max-width:150px;}
  #slider{width:240px;}
  #sliderLabel{font-size:12px;color:#333;min-width:96px;}
  #resetView{font-size:11px;padding:3px 8px;border:1px solid #ddd;border-radius:5px;background:#fff;color:#333;cursor:pointer;}
  #resetView:hover{border-color:#999;}
  #scalebar{position:fixed;left:12px;bottom:12px;z-index:9997;background:rgba(255,255,255,.88);border-radius:5px;padding:4px 7px 3px;font-size:10px;color:#333;line-height:1.1;}
  #scalebar .bar{height:7px;border:1px solid #333;border-top:none;box-sizing:border-box;margin-bottom:2px;}
  #info{font-size:11px;color:#888;}
  #modeLink{font-size:11px;color:#1565c0;text-decoration:none;}
  #modeLink:hover{text-decoration:underline;}
  #birdPanel{display:none;position:fixed;right:20px;bottom:20px;width:320px;max-height:60vh;overflow-y:auto;background:#fff;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.22);padding:16px 18px;font-size:13px;z-index:9999;}
  #birdPanel .h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  #birdPanel .t{font-size:15px;font-weight:700;color:#222;line-height:1.35;}
  #birdPanel .x{cursor:pointer;color:#999;font-size:22px;line-height:1;padding:0 4px;}
  #birdPanel .meta{color:#666;margin-top:10px;line-height:1.8;}
  #legend{position:fixed;right:12px;bottom:12px;z-index:9997;background:rgba(255,255,255,.92);border-radius:6px;padding:6px 9px;font-size:11px;color:#555;display:flex;gap:10px;align-items:center;}
  .dot{display:inline-block;border-radius:50%;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);vertical-align:middle;margin-right:3px;}
  @media (max-width:600px){
    #panel{left:6px;right:6px;top:6px;max-width:none;padding:7px 8px;gap:6px;}
    #panel .row{gap:5px;}
    #speciesBox{flex:1 1 100%;}
    #suggest{min-width:0;max-height:32vh;}
    #slider{width:100%;}
    #sliderLabel{min-width:auto;}
    #birdPanel{left:0;right:0;bottom:0;width:auto;max-height:46vh;border-radius:14px 14px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -4px 24px rgba(0,0,0,.2);}
    #legend{right:6px;bottom:6px;font-size:10px;gap:7px;padding:4px 7px;flex-wrap:wrap;max-width:calc(100vw - 12px);}
    #legend .note{display:none;}
    #scalebar{left:6px;bottom:6px;}
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="boot">⏳ 正在加载…</div>

<div id="panel">
  <div class="row">
    <div id="speciesBox">
      <input type="text" id="speciesInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="输入鸟种名，如 黑脸琵鹭">
      <div id="suggest"></div>
    </div>
    <a id="modeLink" href="#">← 最近鸟讯</a>
  </div>
  <div class="row">
    <span id="sliderLabel">全部时间</span>
    <input type="range" id="slider" min="0" max="24" step="1" value="0">
  </div>
  <div class="row">
    <select id="selProv" title="按省筛选"><option value="">全部省份</option></select>
    <button id="resetView" type="button" title="回到全国视野">回到全国</button>
    <span id="info"></span>
  </div>
</div>

<div id="birdPanel">
  <div class="h"><div class="t" id="pTitle"></div><div class="x" id="pClose">×</div></div>
  <div class="meta" id="pMeta"></div>
</div>

<div id="scalebar"><div class="bar" id="scaleBarLine"></div><span id="scaleText">—</span></div>

<div id="legend">
  <span><i class="dot" style="width:10px;height:10px;background:#90caf9"></i>少</span>
  <span><i class="dot" style="width:14px;height:14px;background:#42a5f5"></i>中</span>
  <span><i class="dot" style="width:18px;height:18px;background:#1565c0"></i>多</span>
  <span class="note" style="color:#999">半月光滑：全部时间 → 12月下半月</span>
</div>

<script>
var started = false, ready = {e: 0, a: 0, e2: 0, d: 0};
function mark(k, v) {
  ready[k] = v;
  if (ready.e === 1 && ready.a === 1 && ready.e2 === 1 && ready.d === 1 && typeof startMap === 'function' && !started) {
    started = true;
    try { startMap(); document.getElementById('boot').style.display = 'none'; }
    catch (err) { document.getElementById('boot').textContent = '初始化失败: ' + (err && err.message ? err.message : err); }
  }
  if (v === -1) document.getElementById('boot').textContent = '地图库加载失败（检查网络）';
}
function loadFallback(key, url) {
  var s = document.createElement('script');
  s.src = url;
  s.onload = function () { mark(key, 1); };
  s.onerror = function () { mark(key, -1); };
  document.body.appendChild(s);
}
// 中国范围 + 按容器像素适配的缩放：电脑和手机看到的范围一致
var CHINA_BOUNDS = { minLng: 73, maxLng: 135, minLat: 18, maxLat: 54 };
function mercY(lat) {
  return Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
}
function fitChinaZoom(pad) {
  var el = document.getElementById('map');
  var w = (el && el.clientWidth) || window.innerWidth;
  var h = (el && el.clientHeight) || window.innerHeight;
  var p = pad || 0.92;
  var lngSpan = CHINA_BOUNDS.maxLng - CHINA_BOUNDS.minLng;
  var ySpan = mercY(CHINA_BOUNDS.maxLat) - mercY(CHINA_BOUNDS.minLat);
  // 256px 瓦片：2^z = 360*宽/(256*经度跨度)
  var zLng = Math.log(360 * w * p / (256 * lngSpan)) / Math.LN2;
  // 墨卡托纵向：2^z = 高*2π/(256*纬度跨度)
  var zLat = Math.log(h * p * 2 * Math.PI / (256 * ySpan)) / Math.LN2;
  var z = Math.min(zLng, zLat);
  return Math.round(Math.max(2, Math.min(18, z)) * 100) / 100;
}

function startMap() {
  var chart = echarts.init(document.getElementById('map'));
  var option = {
    tooltip: { show: false },
    amap: {
      center: [104.2, 35.5], zoom: fitChinaZoom(0.9), viewMode: '2D', resizeEnable: true,
      mapStyle: 'amap://styles/normal', showLabel: true, renderOnMoving: true,
      echartsLayerZIndex: 2019
    },
    series: [{
      type: 'scatter', coordinateSystem: 'amap', data: [],
      cursor: 'pointer', emphasis: { scale: 1.2 }
    }]
  };
  chart.setOption(option);
  var comp = chart.getModel().getComponent('amap');
  if (!comp) throw new Error('高德地图组件未初始化（检查 Key / 域名白名单）');
  var amap = comp.getAMap();

  var DIST = window.SPECIES_DIST || null;
  if (!DIST) {
    document.getElementById('boot').style.display = 'flex';
    document.getElementById('boot').textContent = '缺少 species_dist.js（运行 python birdseek.py map --mode dist 生成）';
    return;
  }
  var cities = DIST.cities || [];
  var species = DIST.species || [];
  var dataMap = DIST.data || {};

  var byLatin = {};
  species.forEach(function (s) { byLatin[String(s[1]).toLowerCase()] = s; });

  var input = document.getElementById('speciesInput');
  var suggestEl = document.getElementById('suggest');
  var MAX_SUG = window.innerWidth <= 600 ? 6 : 8;
  var sugList = [], sugIdx = -1, composing = false;

  function hideSuggest() { suggestEl.style.display = 'none'; sugIdx = -1; }

  function showSuggest(q) {
    q = String(q || '').trim().toLowerCase();
    if (!q) { hideSuggest(); return; }
    var head = [], rest = [];
    for (var i = 0; i < species.length; i++) {
      var name = String(species[i][0] || ''), latin = String(species[i][1] || '');
      var nl = name.toLowerCase(), ll = latin.toLowerCase();
      if (nl.indexOf(q) === 0) head.push(species[i]);
      else if (nl.indexOf(q) > -1 || ll.indexOf(q) > -1) rest.push(species[i]);
      if (head.length >= MAX_SUG) break;
    }
    sugList = head.concat(rest).slice(0, MAX_SUG);
    if (!sugList.length) { hideSuggest(); return; }
    var html = '';
    for (var j = 0; j < sugList.length; j++) {
      html += '<div class="item" data-i="' + j + '">' + sugList[j][0]
        + (sugList[j][1] ? '<span class="lat">' + sugList[j][1] + '</span>' : '')
        + '</div>';
    }
    suggestEl.innerHTML = html;
    suggestEl.style.display = 'block';
    sugIdx = -1;
  }

  function highlightSuggest() {
    var items = suggestEl.querySelectorAll('.item');
    for (var i = 0; i < items.length; i++) {
      if (i === sugIdx) {
        items[i].className = 'item on';
        if (items[i].scrollIntoView) items[i].scrollIntoView({ block: 'nearest' });
      } else {
        items[i].className = 'item';
      }
    }
  }

  function pickSuggest(i) {
    var s = sugList[i];
    if (!s) return;
    input.value = s[0];
    hideSuggest();
    render();
    try { input.blur(); } catch (e) {}   // 手机上收起输入法
  }

  var slider = document.getElementById('slider');
  var sliderLabel = document.getElementById('sliderLabel');
  var selProv = document.getElementById('selProv');
  var info = document.getElementById('info');
  var scaleLine = document.getElementById('scaleBarLine');
  var scaleText = document.getElementById('scaleText');
  function havMeters(lng1, lat1, lng2) {
    var R = 6371000, p = Math.PI / 180, dLng = (lng2 - lng1) * p;
    var a = Math.cos(lat1 * p) * Math.cos(lat1 * p) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function updateScale() {
    try {
      var size = amap.getSize(), b = amap.getBounds(), c = amap.getCenter();
      if (!size || !size.width || !b || !b.northEast || !b.southWest) return;
      var meters = havMeters(b.southWest.lng, c.lat, b.northEast.lng);
      var mpp = meters / size.width;
      if (!isFinite(mpp) || mpp <= 0) return;
      var raw = mpp * 100, pow = Math.pow(10, Math.floor(Math.log10(raw)));
      var norm = raw / pow, nice = norm >= 5 ? 5 : (norm >= 2 ? 2 : 1);
      var dist = nice * pow, px = dist / mpp;
      scaleLine.style.width = Math.round(px) + 'px';
      scaleText.textContent = dist >= 1000 ? (dist / 1000) + ' km' : Math.round(dist) + ' m';
    } catch (e) {}
  }
  amap.on('zoomend', updateScale);
  amap.on('moveend', updateScale);
  updateScale();

  var FN_CENTER = [104.2, 35.5];
  var resetView = document.getElementById('resetView');
  var panel = document.getElementById('birdPanel');
  var pTitle = document.getElementById('pTitle');
  var pMeta = document.getElementById('pMeta');

  var provs = {};
  cities.forEach(function (c) { if (c[1]) provs[c[1]] = 1; });
  Object.keys(provs).sort().forEach(function (p) {
    var o = document.createElement('option'); o.value = p; o.textContent = p;
    selProv.appendChild(o);
  });

  var currentLatin = '';
  var currentPoints = [];

  function halfLabel(h) {
    if (h <= 0) return '全部时间';
    var m = Math.ceil(h / 2), part = (h % 2 === 1) ? '上半月' : '下半月';
    return m + '月' + part;
  }

  function resolveSpecies(text) {
    text = String(text || '').trim().toLowerCase();
    if (!text) return null;
    if (byLatin[text]) return byLatin[text];
    for (var i = 0; i < species.length; i++) {
      if (String(species[i][0]).toLowerCase() === text) return species[i];
    }
    for (var j = 0; j < species.length; j++) {
      if (String(species[j][0]).toLowerCase().indexOf(text) > -1) return species[j];
    }
    return null;
  }

  function colorFor(n) {
    if (n >= 20) return '#0d47a1';
    if (n >= 10) return '#1565c0';
    if (n >= 5) return '#1e88e5';
    if (n >= 2) return '#42a5f5';
    return '#90caf9';
  }

  function render() {
    var sp = resolveSpecies(input.value);
    var hv = parseInt(slider.value, 10) || 0;
    sliderLabel.textContent = halfLabel(hv);
    if (!sp) {
      chart.setOption({ series: [{ data: [] }] });
      info.textContent = input.value ? '未找到该鸟种' : '请输入鸟种名';
      currentPoints = [];
      return;
    }
    currentLatin = sp[1];
    var rows = dataMap[currentLatin] || [];
    var h = parseInt(slider.value, 10) || 0;
    var prov = selProv.value;
    var agg = {};
    rows.forEach(function (r) {
      var idx = r[0], rh = r[1], n = r[2];
      if (h > 0 && rh !== h) return;
      var c = cities[idx];
      if (!c) return;
      if (prov && c[1] !== prov) return;
      agg[idx] = (agg[idx] || 0) + n;
    });
    var out = Object.keys(agg).map(function (idx) {
      var c = cities[idx];
      var n = agg[idx];
      return {
        name: c[0] || '',
        value: [c[2], c[3], n],
        city: c[0], province: c[1], count: n,
        symbolSize: Math.max(8, Math.min(30, 6 + Math.sqrt(n) * 4)),
        itemStyle: {
          color: colorFor(n), borderColor: '#fff', borderWidth: 1.5,
          opacity: 0.9, shadowBlur: 6, shadowColor: 'rgba(0,0,0,.4)'
        }
      };
    });
    chart.setOption({ series: [{ data: out }] });
    currentPoints = out;
    info.textContent = sp[0] + ' · ' + halfLabel(h) + ' · ' + out.length + ' 个城市';

  }

  input.addEventListener('change', render);
  input.addEventListener('input', function () {
    if (composing) return;
    showSuggest(input.value);
    if (input.value.length >= 2) render();
  });
  input.addEventListener('compositionstart', function () { composing = true; });
  input.addEventListener('compositionend', function () {
    composing = false;
    showSuggest(input.value);
    if (input.value.length >= 2) render();
  });
  input.addEventListener('keydown', function (e) {
    var open = suggestEl.style.display === 'block';
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!open) { showSuggest(input.value); return; }
      e.preventDefault();
      if (!sugList.length) return;
      sugIdx = (sugIdx + (e.key === 'ArrowDown' ? 1 : -1) + sugList.length) % sugList.length;
      highlightSuggest();
    } else if (e.key === 'Enter') {
      if (open && sugIdx >= 0) { e.preventDefault(); pickSuggest(sugIdx); }
      else { hideSuggest(); render(); }
    } else if (e.key === 'Escape') {
      hideSuggest();
    }
  });
  input.addEventListener('blur', function () { setTimeout(hideSuggest, 150); });
  suggestEl.addEventListener('mousedown', function (e) { e.preventDefault(); });
  suggestEl.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('.item') : null;
    if (!el) return;
    pickSuggest(parseInt(el.getAttribute('data-i'), 10));
  });
  slider.addEventListener('input', render);
  selProv.addEventListener('change', render);
  resetView.addEventListener('click', function() {
    chart.setOption({ amap: { center: FN_CENTER, zoom: fitChinaZoom(0.9) } });
    setTimeout(updateScale, 200);
  });
  window.addEventListener('resize', function() {
    chart.resize();
    setTimeout(updateScale, 100);
  });

  chart.on('click', function (p) {
    if (p.componentType !== 'series' || !p.data) return;
    var d = p.data;
    var sp = resolveSpecies(input.value) || ['', ''];
    pTitle.textContent = (d.city || d.name) + (d.province ? '（' + d.province + '）' : '');
    pMeta.innerHTML =
      '<div>鸟种：<b>' + sp[0] + '</b>'
      + (sp[1] ? '<br/><span style="color:#999;font-size:11px;">' + sp[1] + '</span>' : '')
      + '</div>'
      + '<div style="margin-top:6px;">时间段：' + halfLabel(parseInt(slider.value, 10) || 0) + '</div>'
      + '<div>记录次数：<b>' + d.count + '</b></div>'
      + '<div style="margin-top:10px;color:#999;font-size:11px;">点地图空白处关闭</div>';
    panel.style.display = 'block';
    try { chart.dispatchAction({ type: 'highlight', seriesIndex: 0, dataIndex: p.dataIndex }); } catch (e) {}
  });
  chart.getZr().on('click', function (e) { if (!e.target) panel.style.display = 'none'; });
  document.getElementById('pClose').addEventListener('click', function () { panel.style.display = 'none'; });

  var link = document.getElementById('modeLink');
  link.href = (location.protocol === 'file:') ? '鸟讯地图_全国.html' : './';

  render();
}
</script>

</body>
