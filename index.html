<script>
var ready = {e:0, a:0, x:0};
var started = false;

function tryStart() {
  if (started) return;
  if (ready.e !== 1 || ready.a !== 1 || ready.x !== 1) return;
  if (typeof startMap !== 'function') return;
  started = true;
  try {
    startMap();
    document.getElementById('boot').style.display = 'none';
  } catch (e) {
    document.getElementById('btip').textContent = '初始化失败: ' + (e && e.message ? e.message : e);
  }
}

function mark(k, v) {
  ready[k] = v;
  var id = {e:'b1', a:'b2', x:'b3'}[k];
  var el = document.getElementById(id);
  if (v === 1) { el.textContent = '✅ ' + el.dataset.name + ' 已加载'; el.className = 'item ok'; }
  if (v === -1) { el.textContent = '❌ ' + el.dataset.name + ' 加载失败'; el.className = 'item err'; }
  tryStart();
}

function loadFallback(key, url) {
  var s = document.createElement('script');
  s.src = url;
  s.onload = function () { mark(key, 1); };
  s.onerror = function () { mark(key, -1); };
  document.body.appendChild(s);
}

setTimeout(function () {
  if (ready.e !== 1 || ready.a !== 1 || ready.x !== 1) {
    var miss = [];
    if (ready.e !== 1) miss.push('ECharts');
    if (ready.a !== 1) miss.push('高德');
    if (ready.x !== 1) miss.push('扩展');
    document.getElementById('btip').innerHTML =
      '⚠️ 超过 20 秒仍未完成：' + miss.join('、') +
      '<br>请检查网络。若三项都 ✅ 但地图仍空白，是高德 Key 的域名白名单问题。';
  }
}, 20000);
</script>

<script>
function startMap() {
  var showLabelPref = true;
  try {
    showLabelPref = localStorage.getItem('birdmap_show_label') !== '0';
  } catch (e) {}
  var MD = window.MAP_META || {};
  var allData = window.MAP_POINTS || [];
  var ebirdAll = window.MAP_EBIRD || [];
  var RARE_SET = new Set(window.MAP_RARE || MD.rare || [] || []);
  var RARITY = MD.rarity || {} || {};
  // 排除最常见 N% 对应的全国稀有度阈值（combined_rarity，越高越少见）
  var RARITY_LEVELS = MD.levels || {} || {"11":0.42,"20":0.45,"30":0.55,"40":0.61,"50":0.65};
  // 本地少见度阈值（1=该市最少见，0=最常见）；11 档对应深圳「≤斑鱼狗」的分界
  var LOCAL_LEVELS = {"11": 0.108, "20": 0.2, "30": 0.3, "40": 0.4, "50": 0.5};
  var localRarityLoading = false;
  function ensureLocalRarity(cb) {
    if (window.LOCAL_RARITY) { cb(); return; }
    if (localRarityLoading) return;
    localRarityLoading = true;
    var s = document.createElement('script');
    s.src = 'local_rarity.js';
    s.onload = function() { localRarityLoading = false; cb(); };
    s.onerror = function() { localRarityLoading = false; };
    document.body.appendChild(s);
  }
  var DEFAULT_PROV = "";
  var DEFAULT_CITY = "深圳市";
  var DEFAULT_DAYS = 7;
  var RANK_LIMIT = 30;      // 补点顺序展示条数（面板可滚动）
  var RANK_MARK_LIMIT = 10; // 地图气泡上显示序号的数量
  var palette = ['#e6194b', '#4363d8', '#f58231', '#42d4f4', '#f032e6', '#3cb44b', '#911eb4', '#ffe119',
                 '#46f0f0', '#bcf60c', '#008080', '#9a6324', '#808000', '#800000', '#000075', '#808080'];

  // 原始点位（不预设颜色，按当前选择动态着色）
  var rendered = allData.map(function(d) {
    return {
      name: d.name,
      value: d.value,
      birds: d.birds,
      dates: d.dates || '',
      datesList: d.datesList || [],
      birdDates: d.birdDates || {},
      province: d.province || '',
      city: d.city || '',
      src: 'records',
      uniqueBirds: [],
      uniqueCount: 0,
      novelty: 0,
      coverRank: null,
      coverGain: null
    };
  });

  // eBird 补充点位：显示时与记录中心合并（参与互补分析和推荐），
  // 仍用 src 区分来源，点位画成三角。
  var ebirdRendered = (ebirdAll || []).map(function(d) {
    return {
      name: d.name,
      value: d.value,
      birds: d.birds,
      dates: d.dates || '',
      datesList: d.datesList || [],
      birdDates: d.birdDates || {},
      birdInfo: d.birdInfo || {},
      province: d.province || '',
      city: d.city || '',
      locId: d.locId || '',
      src: 'ebird',
      uniqueBirds: [],
      uniqueCount: 0,
      novelty: 0,
      noveltyBucket: 5,
      coverRank: null,
      coverGain: null
    };
  });
  var renderedAll = rendered.concat(ebirdRendered);

  // 近 N 天窗口：按鸟种最近出现日期筛点，并重算新鸟/关注数量
  function ymdLocal(dt) {
    function p2(n) { return (n < 10 ? '0' : '') + n; }
    return dt.getFullYear() + '-' + p2(dt.getMonth() + 1) + '-' + p2(dt.getDate());
  }
  function cutoffForDays(days) {
    var t = new Date();
    t.setHours(0, 0, 0, 0);
    t.setDate(t.getDate() - days);
    return ymdLocal(t);
  }
  function windowView(d, cutoff) {
    var bd = d.birdDates || {};
    var dl = d.datesList || [];
    var fallback = dl.length ? dl[dl.length - 1] : '';
    var newB = [], watchedB = [], dates = [];
    (d.birds || '').split(',').forEach(function(t) {
      t = t.trim();
      if (!t) return;
      var star = t.indexOf('⭐') > -1;
      var name = t.replace('⭐', '').trim();
      var mode = selEbirdMode.value;
      if (mode === 'rare' && !RARE_SET.has(name)) return;
      if (mode === 'uncommon' || mode === 'uncommon_local') {
        var bi = (d.src === 'ebird') ? ((d.birdInfo || {})[name] || {}) : null;
        var rv = bi ? bi.rarity : RARITY[name];
        var th = RARITY_LEVELS[selCommonLevel.value] || 0.55;
        var lth = LOCAL_LEVELS[selCommonLevel.value];
        if (lth === undefined) lth = 0.3;
        var keep;
        if (mode === 'uncommon_local') {
          // 本地少见度按点位自身城市判断（0=最常见，1=最少见）。
          // eBird 用生成时按学名算好的 birdInfo.loc，避免中文名别名不一致。
          var lv;
          if (bi) {
            lv = bi.loc;
          } else {
            var cityKey = d.city || selCity.value;
            lv = ((window.LOCAL_RARITY || {})[cityKey] || {})[name];
          }
          var natRare = (rv === undefined || rv === null || rv >= th);
          // 缺本地数据时才回退到全国判断，避免别名/覆盖不全误删
          var locRare = (lv === undefined || lv === null) ? natRare : (lv >= lth);
          // 广东/福建只看本地（本地常见就剔除）；
          // 其他省份保留「本地常见但全国稀有」的地方性鸟
          var strictLocal = (d.province === '广东省' || d.province === '福建省');
          keep = strictLocal ? locRare : (natRare || locRare);
        } else {
          keep = (rv === undefined || rv === null || rv >= th);
        }
        if (!keep) return;
      }
      if (mode === 'mine') {
        if (d.src === 'ebird') {
          var bi = (d.birdInfo || {})[name] || {};
          if (bi.seen) return;
        } else if (!star) {
          return;   // 记录中心里已在个人清单中的种
        }
      }
      var dt = bd[name] || fallback;
      if (!dt || dt < cutoff) return;
      dates.push(dt);
      (star ? newB : watchedB).push(t);
    });
    if (!newB.length && !watchedB.length) return null;
    var item = {};
    for (var k in d) { item[k] = d[k]; }
    item.value = (d.src === 'ebird')
      ? [d.value[0], d.value[1], newB.length + watchedB.length, 0]
      : [d.value[0], d.value[1], newB.length, watchedB.length];
    item.birds = newB.concat(watchedB).join(',');
    dates.sort();
    item.dates = dates[0] === dates[dates.length - 1]
      ? dates[0] : (dates[0] + ' ~ ' + dates[dates.length - 1]);
    item.datesList = dates;
    return item;
  }

  function uniqSpecies(d) {
    var out = [], seen = {};
    (d.birds || '').split(',').forEach(function(b) {
      var k = b.replace('⭐', '').trim();
      if (k && !seen[k]) { seen[k] = 1; out.push(k); }
    });
    return out;
  }

  // 互补分析：按当前筛选范围（全国/省/市）分组，计算独有种 / 互补价值 / 补点优先级
  function computeComplement(list, groupKey) {
    var groups = {};
    list.forEach(function(d) {
      var c = groupKey || '全国';
      (groups[c] = groups[c] || []).push(d);
    });

    Object.keys(groups).forEach(function(cityKey) {
      var group = groups[cityKey];

      var freq = {};
      group.forEach(function(d, i) {
        uniqSpecies(d).forEach(function(k) { (freq[k] = freq[k] || []).push(i); });
      });

      group.forEach(function(d) {
        var names = uniqSpecies(d), unique = [], score = 0;
        names.forEach(function(k) {
          var f = (freq[k] || []).length || 1;
          if (f === 1) unique.push(k);
          score += 1.0 / f;
        });
        d.uniqueBirds = unique;
        d.uniqueCount = unique.length;
        d.novelty = Math.round(score * 100) / 100;
        d.coverRank = null;
        d.coverGain = null;
      });

      var remaining = {};
      Object.keys(freq).forEach(function(k) { remaining[k] = 1; });
      var pool = group.slice().sort(function(a, b) {
        return (b.value[2] + b.value[3]) - (a.value[2] + a.value[3]);
      });
      for (var step = 0; step < RANK_LIMIT; step++) {
        var best = null, bestGain = 0;
        for (var i = 0; i < pool.length; i++) {
          var d = pool[i];
          if (d.coverRank) continue;
          var g = 0;
          uniqSpecies(d).forEach(function(k) { if (remaining[k]) g++; });
          if (g > bestGain) { bestGain = g; best = d; }
        }
        if (!best) break;
        best.coverRank = step + 1;
        best.coverGain = bestGain;
        uniqSpecies(best).forEach(function(k) { delete remaining[k]; });
      }
    });
  }

  // 颜色 = 互补价值（novelty）；大小 = 新鸟种数
  var NOVELTY_BUCKETS = [
    { min: 3.0,  color: '#d50000', label: '≥3 极独特' },
    { min: 2.0,  color: '#ff6d00', label: '2 ~ 3' },
    { min: 1.0,  color: '#ffc400', label: '1 ~ 2' },
    { min: 0.5,  color: '#64dd17', label: '0.5 ~ 1' },
    { min: 0.01, color: '#00b0ff', label: '<0.5' },
    { min: 0,    color: '#b0bec5', label: '无独有种' }
  ];

  function bucketIndex(v) {
    for (var i = 0; i < NOVELTY_BUCKETS.length; i++) {
      if (v >= NOVELTY_BUCKETS[i].min) return i;
    }
    return NOVELTY_BUCKETS.length - 1;
  }

  function symbolSize(count) {

  function styleList(list) {

  // 自绘比例尺：按当前视野（bounds + 容器像素）计算，避免 AMap.Scale 数值偏差
  var scaleLine = document.getElementById('scaleBarLine');
  var scaleText = document.getElementById('scaleText');
  function havMeters(lng1, lat1, lng2) {
    var R = 6371000, p = Math.PI / 180;
    var dLat = 0, dLng = (lng2 - lng1) * p;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2)
          + Math.cos(lat1 * p) * Math.cos(lat1 * p) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function updateScale() {
    try {
      var size = amap.getSize();
      var b = amap.getBounds();
      var c = amap.getCenter();
      if (!size || !size.width || !b || !b.northEast || !b.southWest) return;
      var meters = havMeters(b.southWest.lng, c.lat, b.northEast.lng);
      var mpp = meters / size.width;
      if (!isFinite(mpp) || mpp <= 0) return;
      var raw = mpp * 100;
      var pow = Math.pow(10, Math.floor(Math.log10(raw)));
      var norm = raw / pow;
      var nice = norm >= 5 ? 5 : (norm >= 2 ? 2 : 1);
      var dist = nice * pow;
      var px = dist / mpp;
      scaleLine.style.width = Math.round(px) + 'px';
      scaleText.textContent = dist >= 1000 ? (dist / 1000) + ' km' : Math.round(dist) + ' m';
    } catch (e) {}
  }
  amap.on('zoomend', updateScale);
  amap.on('moveend', updateScale);
  updateScale();

  // 按容器像素把经纬度范围铺满可见区域：电脑和手机看到同样范围
  function mercY(lat) {
    return Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
  }
  var CHINA = { minLng: 73, maxLng: 135, minLat: 18, maxLat: 54 };
  function fitChinaZoom(pad) {
    return zoomForBox(CHINA.maxLng - CHINA.minLng, CHINA.minLat, CHINA.maxLat, pad);
  }
  function zoomForBox(lngSpan, minLat, maxLat, pad) {
    var el = document.getElementById('map');
    var w = (el && el.clientWidth) || window.innerWidth || 1024;
    var h = (el && el.clientHeight) || window.innerHeight || 768;
    var p = pad || 0.9;
    var zLng = Math.log(360 * w * p / (256 * Math.max(0.01, lngSpan))) / Math.LN2;
    var ySpan = Math.max(0.0005, mercY(maxLat) - mercY(minLat));
    var zLat = Math.log(h * p * 2 * Math.PI / (256 * ySpan)) / Math.LN2;
    return Math.round(Math.max(2, Math.min(18, Math.min(zLng, zLat))) * 100) / 100;
  }

  // 按视野经度跨度决定显示阈值（与屏幕/缩放级别解耦）
  //   全国(>30°)：>=10；省(8~30°)：>=1；市(2~8°)：>=2；区/街道(<2°)：全部
  function viewLngSpan() {
    try {
      var b = amap.getBounds();
      if (!b || !b.northEast || !b.southWest) return 999;
      return Math.abs(b.northEast.lng - b.southWest.lng);
    } catch (e) { return 999; }
  }
  function zoomThreshold(spanOverride) {
    if (showAll && showAll.checked) return 0;
    var span = (typeof spanOverride === 'number') ? spanOverride : viewLngSpan();
    if (span > 30) return 10;
    if (span > 8) return 1;
    if (span > 2) return 2;
    return 0;
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderRankPanel() {

      return;

  function refreshSeries(zoom, spanOverride) {

      list = currentStyled.filter(function(d) { return d.value[2] >= th; });
    }
    // 全国视图整体缩小；省/市视图保持固定大小
    var sizeScale = zoom < 6 ? 0.55 : 1;
    if (sizeScale !== 1) {
      list = list.map(function(d) {
        var item = {};
        for (var k in d) { item[k] = d[k]; }
        item.symbolSize = d.symbolSize * sizeScale;

    chart.setOption({ series: [{ data: list }] });
    var count = (list.length === currentList.length)

  var panelTitle = document.getElementById('panelTitle');
  var panelMeta = document.getElementById('panelMeta');
  var panelBirds = document.getElementById('panelBirds');
  var panelCityChart = document.getElementById('panelCityChart');
  var CITY_MONTHS = MD.months || {"years":4.0,"data":{}};

  function fmtCount(n) {
    try { return Number(n).toLocaleString('zh-CN'); } catch (e) { return String(n); }
  }

  // 点位所属城市的近 N 年记录中心月份分布
  function renderCityMonths(d) {
    if (!panelCityChart) return;
    var key = (d.province || '') + '|' + (d.city || '');
    var info = CITY_MONTHS && CITY_MONTHS.data ? CITY_MONTHS.data[key] : null;
    // 省份缺失时按城市名兜底匹配（城市名在数据里基本唯一）
    if ((!info || !info.length) && d.city && CITY_MONTHS && CITY_MONTHS.data) {
      var suffix = '|' + d.city;
      var keys = Object.keys(CITY_MONTHS.data);
      for (var ki = 0; ki < keys.length; ki++) {
        if (keys[ki].slice(-suffix.length) === suffix) {
          info = CITY_MONTHS.data[keys[ki]];
          break;
        }
      }
    }
    if (!info || !info.length) {
      panelCityChart.style.display = 'none';
      panelCityChart.innerHTML = '';
      return;
    }
    var vals = info, max = 0, total = 0, hot = 0;
    vals.forEach(function (v, i) {
      if (v > max) { max = v; hot = i; }
      total += v;
    });
    if (!total) {
      panelCityChart.style.display = 'none';
      panelCityChart.innerHTML = '';
      return;
    }
    var html = '<div class="ch"><span>该市月份分布（记录中心 · 近 '
      + (CITY_MONTHS.years || 4) + ' 年）</span><span>共 <b>' + fmtCount(total)
      + '</b> 条</span></div><div class="bars">';
    vals.forEach(function (v, i) {
      var h = max ? Math.max(3, Math.round(v / max * 100)) : 3;
      html += '<div class="bar' + (i === hot ? ' hot' : '') + '" title="'
        + (i + 1) + '月：' + fmtCount(v) + ' 条">'
        + '<i style="height:' + h + '%"></i></div>';
    });
    html += '</div><div class="ax">';
    for (var i = 1; i <= 12; i++) html += '<span>' + i + '</span>';
    html += '</div>';
    panelCityChart.innerHTML = html;
    panelCityChart.style.display = 'block';
  }

  // 面板里按全国稀有度排序（高=更罕见，放前面；无数据放最后）
  function birdRarity(d, name) {
    var bi = (d.birdInfo || {})[name] || {};
    var v = (d.src === 'ebird') ? bi.rarity
      : (RARITY[name] !== undefined ? RARITY[name] : bi.rarity);
    return (typeof v === 'number' && isFinite(v)) ? v : -1;
  }

  function showPanel(d) {
    var isEbird = d.src === 'ebird';
    panelTitle.innerHTML = d.name + '<span class="panel-type type-point">'
      + (isEbird ? 'eBird' : '具体点位') + '</span>';

    var modeLabel = {mine: '我的清单外',
                     uncommon: '排除常见(全国) ' + selCommonLevel.value + '%',
                     uncommon_local: '排除常见(本地) ' + selCommonLevel.value + '%',
                     rare: '仅罕见', all: '全部'}[selEbirdMode.value]
      || '我的清单外';
    var place = [d.province, d.city].filter(Boolean).join(' · ');
    var meta = (place ? '<div class="place">' + place + '</div>' : '');
    meta += isEbird
      ? 'eBird 补充记录 · ' + d.value[2] + ' 种鸟（' + modeLabel + '）'
      : '共 ' + d.value[2] + ' 种（' + modeLabel + '），' + d.value[3] + ' 种关注';
    meta += '<br/>独有鸟种：' + (d.uniqueCount || 0) + ' 种';
    if (d.ebirdAdded) {
      meta += '<br/><span style="color:#00897b;font-size:14px;">●</span> 含 eBird 补充 '
              + d.ebirdAdded + ' 种（同地点已合并）';
    }
    if (d.coverRank) {
      meta += (selRankMode.value === 'count')
        ? '<br/>' + scopeLabel + '鸟种数排名：第 ' + d.coverRank + ' 位（' + d.value[2] + ' 种）'
        : '<br/>' + scopeLabel + '补点优先级：第 ' + d.coverRank + ' 位（新增 ' + d.coverGain + ' 种）';
    }
    if (d.dates) meta += '<br/>记录时间：' + d.dates;
    if (isEbird) {
      meta += '<br/><span style="color:#00897b;font-size:14px;">●</span> 来源：eBird（与记录中心数据分开）';
    } else {
      meta += '<br/><span style="color:' + d.groupColor + ';font-size:14px;">●</span> ' +
              '颜色档位：' + NOVELTY_BUCKETS[d.noveltyBucket || 0].label;
    }
    panelMeta.innerHTML = meta;
    renderCityMonths(d);

    var uniqueSet = {};
    (d.uniqueBirds || []).forEach(function(n) { uniqueSet[n] = 1; });
    var list = d.birds ? d.birds.split(',') : [];
    list.sort(function(a, b) {
      var ra = birdRarity(d, a.replace('⭐', '').trim());
      var rb = birdRarity(d, b.replace('⭐', '').trim());
      if (rb !== ra) return rb - ra;
      return a.localeCompare(b, 'zh');
    });
    panelBirds.innerHTML = list.map(function(b) {
      var name = b.replace('⭐', '').trim();
      var isFocus = !isEbird && b.indexOf('⭐') > -1;
      var bi2 = isEbird ? ((d.birdInfo || {})[name] || {}) : null;
      var isNew = isEbird ? (bi2 ? bi2.seen === 0 : false) : isFocus;
      // 星号只标新鸟，且只在「我的清单外」模式显示
      var showStar = selEbirdMode.value === 'mine';
      var isUnique = !!uniqueSet[name];
      var cls = 'tag' + (isEbird ? ' ebird' : '') + (isNew ? ' focus' : '')
                + (isUnique ? ' unique' : '');
      var tip = isEbird
        ? ('eBird 记录 · 你未见过' + (isUnique ? ' · 同城内只有该点记录到' : ''))
        : (isUnique ? '同城内只有该点记录到' : (isFocus ? '新鸟或关注鸟' : '已见鸟'));
      var mark = (showStar && isNew) ? '⭐ ' : '';
      var dl = (d.birdDateList || {})[name];
      if (!dl && (d.birdDates || {})[name]) dl = [d.birdDates[name]];
      dl = (dl || []).slice().sort();
      var dstr = dl.map(function(x) { return x.slice(5); }).join('、');
      var dtip = tip + (dstr ? ' · 记录于 ' + dl.join('、') : '');
      var inner = (dl.length > 1)
        ? '<span class="clk">⏱' + dl.length + '</span><span class="bdates">' + esc(dstr) + '</span>'
        : '';
      return '<span class="' + cls + (dl.length > 1 ? ' has-dates' : '') + '" title="' + dtip + '">' +
             mark + (isUnique ? '◆ ' : '') + name + inner + '</span>';
    }).join('');

    panel.style.display = 'block';
  }

  if (panelBirds) {
    panelBirds.addEventListener('click', function(ev) {
      var t = ev.target;
      while (t && t !== panelBirds && !(t.classList && t.classList.contains('has-dates'))) t = t.parentNode;
      if (!t || t === panelBirds) return;
      t.classList.toggle('open');
    });
  }

  function closePanel() { panel.style.display = 'none'; }

  chart.on('click', function(p) {
    if (p.componentType === 'series' && p.data) {
      chart.dispatchAction({ type: 'hideTip' });
      showPanel(p.data);
    }
  });

  chart.getZr().on('click', function(e) {
    if (!e.target) closePanel();
  });

  var distLink = document.getElementById('distLink');
  if (distLink) {
    distLink.href = (location.protocol === 'file:')
      ? '鸟种分布_全国.html' : 'dist.html';
  }
  var regionLink = document.getElementById('regionLink');
  if (regionLink) {
    regionLink.href = (location.protocol === 'file:')
      ? '地区鸟类_全国.html' : 'region.html';
  }

  var closeBtn = document.getElementById('panelClose');
  closeBtn.addEventListener('click', function(e) {
    e.stopPropagation(); e.preventDefault(); closePanel();
  }, false);
  closeBtn.addEventListener('touchstart', function(e) {
    e.stopPropagation(); e.preventDefault(); closePanel();
  }, { passive: false });

  panel.addEventListener('click', function(e) { e.stopPropagation(); });

  rankList.addEventListener('click', function(e) {
    var node = e.target;
    while (node && node !== rankList && !(node.dataset && node.dataset.name)) {
      node = node.parentNode;
    }
    if (!node || node === rankList || !node.dataset) return;
    var target = null;
    for (var i = 0; i < currentStyled.length; i++) {
      if (currentStyled[i].name === node.dataset.name) { target = currentStyled[i]; break; }
    }
    if (!target) return;
    chart.setOption({ amap: { center: [target.value[0], target.value[1]],
                              zoom: Math.max(amap.getZoom(), 12) } });
    showPanel(target);
  });

  btnRank.addEventListener('click', function() {
    rankPanel.style.display = (rankPanel.style.display === 'block') ? 'none' : 'block';
  });
  document.getElementById('rankClose').addEventListener('click', function() {
    rankPanel.style.display = 'none';
  });

  // 小屏：排行榜紧贴工具栏下方，避免工具栏换行后重叠
  function syncRankTop() {
    var pk = document.getElementById('picker');
    var rp = document.getElementById('rankPanel');
    if (!pk || !rp) return;
    if (window.innerWidth <= 600) {
      rp.style.top = Math.round(pk.getBoundingClientRect().bottom + 8) + 'px';
    } else {
      rp.style.top = '';
    }
  }
  window.addEventListener('resize', function() {
    chart.resize();
    setTimeout(updateScale, 100);
    syncRankTop();
  });
  setTimeout(syncRankTop, 0);
}
tryStart();
</script>
</body>
</html>
