  #missing{position:fixed;right:12px;bottom:12px;z-index:9997;background:rgba(255,243,224,.92);color:#e65100;border-radius:6px;padding:4px 8px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:11px;box-shadow:0 2px 8px rgba(0,0,0,.12);}

<script>
var ready = {e:0, a:0, x:0};
var started = false;

function tryStart() {
  if (started) return;
  if (ready.e !== 1 || ready.a !== 1 || ready.x !== 1) return;
  if (typeof startMap !== 'function') return;
  started = true;
  try {
    startMap();
    document.getElementById('boot').style.display = 'none';
  } catch (e) {
    document.getElementById('btip').textContent = '初始化失败: ' + (e && e.message ? e.message : e);
  }
}

function mark(k, v) {
  ready[k] = v;
  var id = {e:'b1', a:'b2', x:'b3'}[k];
  var el = document.getElementById(id);
  if (v === 1) { el.textContent = '✅ ' + el.dataset.name + ' 已加载'; el.className = 'item ok'; }
  if (v === -1) { el.textContent = '❌ ' + el.dataset.name + ' 加载失败'; el.className = 'item err'; }
  tryStart();
}

setTimeout(function () {
  if (ready.e !== 1 || ready.a !== 1 || ready.x !== 1) {
    var miss = [];
    if (ready.e !== 1) miss.push('ECharts');
    if (ready.a !== 1) miss.push('高德');
    if (ready.x !== 1) miss.push('扩展');
    document.getElementById('btip').innerHTML =
      '⚠️ 超过 20 秒仍未完成：' + miss.join('、') +
      '<br>请检查网络。若三项都 ✅ 但地图仍空白，是高德 Key 的域名白名单问题。';
  }
}, 20000);
</script>

        borderColor: '#ffffff',
        borderWidth: 2,
        shadowBlur: 9,
        shadowColor: 'rgba(0,0,0,0.6)'
      };
      // 只给市内推荐的前 10 个点显示顺序号（1 = 新鸟最多）
      item.label = {
        show: !!top,
        formatter: String(d.coverRank || ''),
        position: 'inside',
        fontSize: d.coverRank === 1 ? 12 : 10,
        fontWeight: 'bold',
        color: '#111',
        textBorderColor: 'rgba(255,255,255,0.9)',
        textBorderWidth: 2
      };
      return item;
    });
  }

  var chart = echarts.init(document.getElementById('map'));

  var option = {
    tooltip: { show: false },
    amap: {
      center: [114.0579, 22.5431],
      zoom: 10,
      viewMode: '2D',
      resizeEnable: true,
      mapStyle: 'amap://styles/normal',
      showLabel: showLabelPref,
      renderOnMoving: true,
      echartsLayerZIndex: 2019
    },
    series: [{
      type: 'scatter',
      coordinateSystem: 'amap',
      data: [],
      emphasis: { scale: 1.15 }
    }]
  };

  chart.setOption(option);

  var amapComp = chart.getModel().getComponent('amap');
  if (!amapComp) {
    throw new Error('高德地图组件未初始化（检查 Key / 域名白名单）');
  }
  var amap = amapComp.getAMap();
  var satellite = null, roadnet = null;

  if (AMap && AMap.TileLayer) {
    try {
      satellite = new AMap.TileLayer.Satellite();
    } catch (e) { satellite = null; }
    try {
      if (AMap.TileLayer.RoadNet) {
        roadnet = new AMap.TileLayer.RoadNet();
      }
    } catch (e) { roadnet = null; }
  }

  // ---- 当前状态 ----
  var currentList = [];     // 区域过滤后的原始点位
  var currentStyled = [];

  var selProv = document.getElementById('selProv');
  var selCity = document.getElementById('selCity');
  var selBird = document.getElementById('selBird');
  var selDays = document.getElementById('selDays');
  var pickInfo = document.getElementById('pickInfo');
  var showAll = document.getElementById('showAll');
  var showRoadChk = document.getElementById('showRoadChk');
  var showLabelChk = document.getElementById('showLabelChk');
  var selMapType = document.getElementById('selMapType');
  var btnRank = document.getElementById('btnRank');
  var rankPanel = document.getElementById('rankPanel');
  var rankList = document.getElementById('rankList');

  try {
    showAll.checked = localStorage.getItem('birdmap_show_all') !== '0';
    showLabelChk.checked = showLabelPref;
    showRoadChk.checked = localStorage.getItem('birdmap_show_road') === '1';
    var mt = localStorage.getItem('birdmap_map_type2');
    if (mt) selMapType.value = mt;
    var md = localStorage.getItem('birdmap_days');
    if (md && /^[0-9]+$/.test(md)) selDays.value = md;
  } catch (e) {}
  showAll.addEventListener('change', function() {
    try { localStorage.setItem('birdmap_show_all', showAll.checked ? '1' : '0'); } catch (e) {}
    refreshSeries(amap.getZoom());
  });

  var layerState = { sat: false, road: false };
  function setLayer(layer, on, key) {
    if (!layer || layerState[key] === on) return;
    try {
      if (on) { amap.add(layer); } else { amap.remove(layer); }
      layerState[key] = on;
    } catch (e) {}
  }

  var MAP_STYLES = {
    normal: 'amap://styles/normal',
    dark: 'amap://styles/dark',
    light: 'amap://styles/light',
    grey: 'amap://styles/grey'
  };

  function applyMapType() {
    var t = selMapType.value;
    var sat = (t === 'satellite');
    setLayer(satellite, sat, 'sat');
    try { amap.setMapStyle(sat ? MAP_STYLES.normal : (MAP_STYLES[t] || MAP_STYLES.normal)); } catch (e) {}
    applyLayerVisibility();
  }

  function applyLayerVisibility() {
    setLayer(roadnet, !!showRoadChk.checked, 'road');
  }

  showLabelChk.addEventListener('change', function() {
    try { localStorage.setItem('birdmap_show_label', showLabelChk.checked ? '1' : '0'); } catch (e) {}
    // showLabel 只能在 new AMap.Map 时生效，刷新一次
    location.reload();
  });
  showRoadChk.addEventListener('change', function() {
    try { localStorage.setItem('birdmap_show_road', showRoadChk.checked ? '1' : '0'); } catch (e) {}
    applyLayerVisibility();
  });
  selMapType.addEventListener('change', function() {
    try { localStorage.setItem('birdmap_map_type2', selMapType.value); } catch (e) {}
    applyMapType();
  });
  applyMapType();

  function zoomForSpan(span) {
    if (span <= 0) return 13;
    if (span < 0.05) return 13;
    if (span < 0.2) return 12;
    if (span < 1.0) return 11;
    if (span < 3.0) return 10;
    if (span < 10.0) return 8;
    if (span < 30.0) return 6;
    if (span < 80.0) return 5;
    return 4;
  }

  // 缩放级别 → 只显示「新鸟种数 >= 阈值」的点
  //   全国(<6)：>=10；省(6~7)：全部（仅隐藏 0 新鸟）；市(8~9)：>=2；区/街道(>=10)：全部
  //   勾选「全部」时任何缩放都显示全部
  function zoomThreshold(zoom) {
    if (showAll && showAll.checked) return 0;
    if (zoom >= 10) return 0;
    if (zoom >= 8) return 2;
    if (zoom >= 6) return 1;
    return 10;
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderRankPanel() {
    var ranked = currentList.filter(function(d) { return d.coverRank; })
      .sort(function(a, b) { return a.coverRank - b.coverRank; });
    if (!ranked.length) {
      rankList.innerHTML = '<div style="color:#999;padding:4px 2px;">当前区域暂无推荐</div>';
      return;
    }
    var html = '';
    ranked.forEach(function(d) {
      html += '<div class="item" data-name="' + esc(d.name) + '">' +
              '<span class="no">#' + d.coverRank + '</span>' +
              '<span class="nm" title="' + esc(d.name) + '">' + esc(d.name) + '</span>' +
              '<span class="gain">' + d.value[2] + '种 / +' + d.coverGain + '</span></div>';
    });
    rankList.innerHTML = html;
  }

  function refreshSeries(zoom) {
    if (zoom === undefined || zoom === null) zoom = amap.getZoom();
    var th = zoomThreshold(zoom);
    var list = currentStyled.filter(function(d) { return d.value[2] >= th; });
    while (!list.length && th > 0) {
      th -= 1;
      list = currentStyled.filter(function(d) { return d.value[2] >= th; });
    }
    // 全国视图整体缩小；省/市视图保持固定大小
    var sizeScale = zoom < 6 ? 0.55 : 1;
    if (sizeScale !== 1) {
      list = list.map(function(d) {
        var item = {};
        for (var k in d) { item[k] = d[k]; }
        item.symbolSize = d.symbolSize * sizeScale;
        return item;
      });
    }
    chart.setOption({ series: [{ data: list }] });
    var count = (list.length === currentList.length)
      ? (list.length + ' 点')
      : (list.length + ' / ' + currentList.length + ' 点');
    pickInfo.textContent = count + ' · 数字=市内补点顺序';
  }

  function populateBirds(region) {
    var keep = selBird.value;
    var counts = {};
    region.forEach(function(d) {
      uniqSpecies(d).forEach(function(k) { counts[k] = (counts[k] || 0) + 1; });
    });
    var names = Object.keys(counts).sort(function(a, b) {
      return counts[b] - counts[a] || a.localeCompare(b);
    });
    selBird.innerHTML = '';
    var all = document.createElement('option');
    all.value = ''; all.textContent = '全部鸟种';
    selBird.appendChild(all);
    names.forEach(function(n) {
      var o = document.createElement('option');
      o.value = n; o.textContent = n + '（' + counts[n] + '）';
      selBird.appendChild(o);
    });
    selBird.value = (keep && counts[keep]) ? keep : '';
  }

  function applyFilter(keepView) {
    var prov = selProv.value, city = selCity.value;
    var days = parseInt(selDays.value, 10) || 7;
    var cutoff = cutoffForDays(days);
    var region = [];
    rendered.forEach(function(d) {
      if (prov && d.province !== prov) return;
      if (city && d.city !== city) return;
      var v = windowView(d, cutoff);
      if (v) region.push(v);
    });
    populateBirds(region);
    var bird = selBird.value;
    currentList = bird
      ? region.filter(function(d) { return uniqSpecies(d).indexOf(bird) > -1; })
      : region;
    computeComplement(currentList);
    currentStyled = styleList(currentList);
    renderRankPanel();

    var opt = { series: [{ data: currentStyled }] };
    var targetZoom = amap.getZoom();
    if (!keepView) {
      var center = [114.0579, 22.5431];
      var zoom = 10;
      if (currentList.length) {
        var lngs = currentList.map(function(d) { return d.value[0]; });
        var lats = currentList.map(function(d) { return d.value[1]; });
        var minLng = Math.min.apply(null, lngs), maxLng = Math.max.apply(null, lngs);
        var minLat = Math.min.apply(null, lats), maxLat = Math.max.apply(null, lats);
        center = [(minLng + maxLng) / 2, (minLat + maxLat) / 2];
        zoom = zoomForSpan(Math.max(maxLng - minLng, maxLat - minLat));
      }
      opt.amap = { center: center, zoom: zoom };
      targetZoom = zoom;
    }
    chart.setOption(opt);
    refreshSeries(targetZoom);
  }

  function populateCities() {
    var prov = selProv.value;
    selCity.innerHTML = '';
    selCity.value = '';
    var all = document.createElement('option');
    all.value = ''; all.textContent = '全部城市';
    selCity.appendChild(all);
    var cities = {};
    rendered.forEach(function(d) {
      if (prov && d.province !== prov) return;
      if (d.city) cities[d.city] = (cities[d.city] || 0) + 1;
    });
    Object.keys(cities).sort().forEach(function(name) {
      var o = document.createElement('option');
      o.value = name; o.textContent = name + '（' + cities[name] + '）';
      selCity.appendChild(o);
    });
  }

  var optAll = document.createElement('option');
  optAll.value = ''; optAll.textContent = '全国';
  selProv.appendChild(optAll);
  var provNames = {};
  rendered.forEach(function(d) { if (d.province) provNames[d.province] = (provNames[d.province] || 0) + 1; });
  Object.keys(provNames).sort().forEach(function(p) {
    var o = document.createElement('option');
    o.value = p; o.textContent = p + '（' + provNames[p] + '）';
    selProv.appendChild(o);
  });

  selProv.addEventListener('change', function() {
    populateCities();
    applyFilter(false);
  });
  selCity.addEventListener('change', function() { applyFilter(false); });
  selBird.addEventListener('change', function() { applyFilter(true); });
  selDays.addEventListener('change', function() {
    try { localStorage.setItem('birdmap_days', selDays.value); } catch (e) {}
    applyFilter(true);
  });
  populateCities();

  var defaultHit = null;
  if (DEFAULT_CITY) {
    rendered.forEach(function(d) { if (d.city === DEFAULT_CITY) defaultHit = d; });
  }
  if (defaultHit) {
    if (defaultHit.province) {
      selProv.value = defaultHit.province;
      populateCities();
    } else if (DEFAULT_PROV) {
      selProv.value = DEFAULT_PROV;
      populateCities();
    }
    selCity.value = DEFAULT_CITY;
    applyFilter(false);
  } else {
    applyFilter(true);
  }

  amap.on('zoomend', function() { refreshSeries(amap.getZoom()); });

  // ---- 面板 ----
  var panel = document.getElementById('birdPanel');
  var panelTitle = document.getElementById('panelTitle');
  var panelMeta = document.getElementById('panelMeta');
  var panelBirds = document.getElementById('panelBirds');

  function showPanel(d) {
    panelTitle.innerHTML = d.name + '<span class="panel-type type-point">具体点位</span>';

    var meta = '共 ' + d.value[2] + ' 种新鸟，' + d.value[3] + ' 种关注';
    meta += '<br/>独有鸟种：' + (d.uniqueCount || 0) + ' 种';
    if (d.coverRank) {
      meta += '<br/>市内补点优先级：第 ' + d.coverRank + ' 位（新增 ' + d.coverGain + ' 种）';
    }
    if (d.dates) meta += '<br/>记录时间：' + d.dates;
    meta += '<br/><span style="color:' + d.groupColor + ';font-size:14px;">●</span> ' +
            '颜色档位：' + NOVELTY_BUCKETS[d.noveltyBucket || 0].label +
            ' · 省份：' + (d.province || '未知');
    panelMeta.innerHTML = meta;

    var uniqueSet = {};
    (d.uniqueBirds || []).forEach(function(n) { uniqueSet[n] = 1; });
    var list = d.birds ? d.birds.split(',') : [];
    panelBirds.innerHTML = list.map(function(b) {
      var name = b.replace('⭐', '');
      var isFocus = b.indexOf('⭐') > -1;
      var isUnique = !!uniqueSet[name];
      var cls = 'tag' + (isFocus ? ' focus' : '') + (isUnique ? ' unique' : '');
      var tip = isUnique ? '同城内只有该点记录到' : (isFocus ? '新鸟或关注鸟' : '已见鸟');
      return '<span class="' + cls + '" title="' + tip + '">' +
             (isFocus ? '⭐ ' : '') + (isUnique ? '◆ ' : '') + name + '</span>';
    }).join('');

    panel.style.display = 'block';
  }

  function closePanel() { panel.style.display = 'none'; }

  chart.on('click', function(p) {
    if (p.componentType === 'series' && p.data) {
      chart.dispatchAction({ type: 'hideTip' });
      showPanel(p.data);
    }
  });

  chart.getZr().on('click', function(e) {
    if (!e.target) closePanel();
  });

  var closeBtn = document.getElementById('panelClose');
  closeBtn.addEventListener('click', function(e) {
    e.stopPropagation(); e.preventDefault(); closePanel();
  }, false);
  closeBtn.addEventListener('touchstart', function(e) {
    e.stopPropagation(); e.preventDefault(); closePanel();
  }, { passive: false });

  panel.addEventListener('click', function(e) { e.stopPropagation(); });

  rankList.addEventListener('click', function(e) {
    var node = e.target;
    while (node && node !== rankList && !(node.dataset && node.dataset.name)) {
      node = node.parentNode;
    }
    if (!node || node === rankList || !node.dataset) return;
    var target = null;
    for (var i = 0; i < currentStyled.length; i++) {
      if (currentStyled[i].name === node.dataset.name) { target = currentStyled[i]; break; }
    }
    if (!target) return;
    chart.setOption({ amap: { center: [target.value[0], target.value[1]],
                              zoom: Math.max(amap.getZoom(), 12) } });
    showPanel(target);
  });

  btnRank.addEventListener('click', function() {
    rankPanel.style.display = (rankPanel.style.display === 'block') ? 'none' : 'block';
  });
  document.getElementById('rankClose').addEventListener('click', function() {
    rankPanel.style.display = 'none';
  });

  window.addEventListener('resize', function() { chart.resize(); });
}
tryStart();
</script>
</body>
</html>
