<style>
  html,body{height:100%;margin:0;overflow:hidden;}
  #map{width:100%;height:100vh;height:100dvh;}
  #boot{position:fixed;inset:0;background:#fafafa;z-index:99999;display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  #boot .item{margin:6px 0;font-size:14px;color:#999;}
  #boot .ok{color:#2e7d32;}
  #boot .err{color:#d32f2f;font-weight:600;}
  #boot .tip{margin-top:22px;max-width:86vw;font-size:13px;color:#777;line-height:1.8;text-align:center;}

  #legend{position:fixed;left:12px;top:12px;z-index:9998;background:rgba(255,255,255,.95);border-radius:7px;padding:7px 9px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:10.5px;color:#333;box-shadow:0 3px 12px rgba(0,0,0,.16);line-height:1.45;max-width:210px;max-height:calc(100vh - 24px);overflow-y:auto;}
  #legend .row{display:flex;align-items:center;gap:5px;font-size:10.5px;}
  #legend .dot{width:9px;height:9px;border-radius:50%;background:#d32f2f;border:1.5px solid #fff;box-shadow:0 0 0 1px #d32f2f;flex-shrink:0;}
  #legend .sep{height:1px;background:#eee;margin:4px 0;}
  #legend .lbl{font-size:10px;color:#666;margin:1px 0 3px;}
  #legend .sizes{display:flex;align-items:flex-end;gap:6px;margin:1px 0 3px;padding-left:1px;}
  #legend .sz{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9px;color:#777;}
  #legend .sz i{display:block;border-radius:50%;background:#b0b0b0;}
  #legend .groups{display:flex;flex-direction:column;gap:1px;}
  #legend .grow{display:flex;align-items:center;gap:4px;font-size:10px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #legend .grow i{width:9px;height:9px;border-radius:2px;flex-shrink:0;}

  #picker{position:fixed;right:12px;top:12px;z-index:9998;display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.95);border-radius:7px;padding:6px 8px;box-shadow:0 3px 12px rgba(0,0,0,.16);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:12px;color:#333;max-width:calc(100vw - 24px);}
  #picker select{max-width:132px;font-size:12px;padding:2px 4px;border:1px solid #ddd;border-radius:4px;background:#fff;color:#333;}
  #picker .info{color:#888;font-size:11px;white-space:nowrap;}

  #subtitle{position:fixed;left:12px;bottom:12px;z-index:9997;background:rgba(255,255,255,.85);border-radius:6px;padding:4px 8px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:11px;color:#555;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #missing{position:fixed;right:12px;bottom:12px;z-index:9997;background:rgba(255,243,224,.92);color:#e65100;border-radius:6px;padding:4px 8px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:11px;box-shadow:0 2px 8px rgba(0,0,0,.12);}
  #missing:empty{display:none;}

  #birdPanel{display:none;position:fixed;right:20px;bottom:20px;width:340px;max-height:65vh;overflow-y:auto;background:#fff;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.22);padding:16px 18px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;z-index:9999;-webkit-overflow-scrolling:touch;}
  #birdPanel .drawer-bar{display:none;}
  #birdPanel .panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  #birdPanel .panel-title{font-size:15px;font-weight:700;color:#222;line-height:1.35;}
  #birdPanel .panel-type{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle;white-space:nowrap;}
  #birdPanel .type-point{background:#e8f5e9;color:#2e7d32;}
  #birdPanel .panel-close{cursor:pointer;color:#999;font-size:22px;line-height:1;padding:6px 10px;flex-shrink:0;margin:-6px -10px -6px 0;}
  #birdPanel .panel-close:hover{color:#d32f2f;}
  #birdPanel .panel-meta{color:#666;margin:8px 0 12px;padding-bottom:8px;border-bottom:1px solid #eee;line-height:1.7;}
  #birdPanel .tag{display:inline-block;margin:0 6px 6px 0;padding:3px 8px;border-radius:5px;background:#f2f2f2;color:#333;white-space:nowrap;}
  #birdPanel .tag.focus{background:#ffebee;color:#c62828;font-weight:600;}
  #birdPanel .legend{margin-top:10px;color:#999;font-size:12px;}

  @media (max-width:600px){
    #legend{left:6px;top:56px;padding:6px 8px;font-size:10px;line-height:1.4;max-width:170px;max-height:42vh;}
    #legend .sizes{gap:5px;}
    #picker{left:6px;right:6px;top:6px;justify-content:center;padding:5px 6px;}
    #picker select{max-width:38vw;}
    #subtitle{left:6px;bottom:6px;max-width:40vw;}
    #missing{right:6px;bottom:6px;}
    #birdPanel{left:0;right:0;bottom:0;width:auto;max-height:55vh;border-radius:14px 14px 0 0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -4px 24px rgba(0,0,0,.2);}
    #birdPanel .drawer-bar{display:block;width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 10px;}
    #birdPanel .panel-title{font-size:14px;}
    #birdPanel .tag{margin:0 5px 5px 0;padding:3px 7px;}
  }
</style>

<script>
var ready = {e:0, a:0, x:0};
var started = false;

function tryStart() {
  if (started) return;
  if (ready.e !== 1 || ready.a !== 1 || ready.x !== 1) return;
  if (typeof startMap !== 'function') return;
  started = true;
  document.getElementById('boot').style.display = 'none';
  startMap();
}

function mark(k, v) {
  ready[k] = v;
  var id = {e:'b1', a:'b2', x:'b3'}[k];
  var el = document.getElementById(id);
  if (v === 1) { el.textContent = '✅ ' + el.dataset.name + ' 已加载'; el.className = 'item ok'; }
  if (v === -1) { el.textContent = '❌ ' + el.dataset.name + ' 加载失败'; el.className = 'item err'; }
  tryStart();
}

setTimeout(function () {
  if (ready.e !== 1 || ready.a !== 1 || ready.x !== 1) {
    var miss = [];
    if (ready.e !== 1) miss.push('ECharts');
    if (ready.a !== 1) miss.push('高德');
    if (ready.x !== 1) miss.push('扩展');
    document.getElementById('btip').innerHTML =

      '<br>请检查网络。若三项都 ✅ 但地图仍空白，是高德 Key 的域名白名单问题。';
  }
}, 20000);
</script>

      var s = 0, cnt = 0;
      for (var x = 0; x < c1.members.length; x++) {
        for (var y = 0; y < c2.members.length; y++) {
          s += sim[c1.members[x]][c2.members[y]];
          cnt++;
        }
      }
      return cnt ? s / cnt : 0;
    }

    var target = Math.min(K, n);
    while (clusters.length > target) {
      var best = -1, bi = 0, bj = 1;
      for (var p = 0; p < clusters.length; p++) {
        for (var q = p + 1; q < clusters.length; q++) {
          var val = avg(clusters[p], clusters[q]);
          if (val > best) { best = val; bi = p; bj = q; }
        }
      }
      var merged = { members: clusters[bi].members.concat(clusters[bj].members) };
      clusters.splice(bj, 1);
      clusters.splice(bi, 1);
      clusters.push(merged);
    }

    var clusterOf = new Array(n);
    clusters.forEach(function(c, idx) {
      c.members.forEach(function(m) { clusterOf[m] = idx; });
    });

    var globalCount = {};
    sets.forEach(function(s) { for (var k in s) globalCount[k] = (globalCount[k] || 0) + 1; });
    var labels = clusters.map(function(c) {
      var local = {};
      c.members.forEach(function(m) {
        for (var k in sets[m]) local[k] = (local[k] || 0) + 1;
      });
      var size = c.members.length;
      var scored = Object.keys(local).map(function(k) {
        var lf = local[k] / size;
        var gf = globalCount[k] / n;
        return { name: k, score: lf - gf * 0.7 };
      });
      scored.sort(function(a, b) { return b.score - a.score; });
      return scored.slice(0, 3).map(function(x) { return x.name; });
    });

    return { clusters: clusters, clusterOf: clusterOf, labels: labels };
  }

  var groups = null, colorOf = [], order = [];
  var provList = [], provCount = {}, provColor = {};

  if (PROVINCE_MODE) {
    allData.forEach(function(d) {
      var p = d.province || '未知';
      if (!provCount[p]) { provCount[p] = 0; provList.push(p); }
      provCount[p]++;
    });
    provList.sort();
    provList.forEach(function(p, i) { provColor[p] = palette[i % palette.length]; });
  } else {
    groups = computeGroups(allData, 8);
    order = groups.clusters.map(function(c, i) {
      return { i: i, n: c.members.length };
    }).sort(function(a, b) { return b.n - a.n; });
    order.forEach(function(o, idx) { colorOf[o.i] = palette[idx % palette.length]; });
  }

  function symbolSize(count) {
    return Math.max(10, 8 + Math.sqrt(count) * 4.2);
  }

  var showLabels = allData.length <= 200;
  var rendered = allData.map(function(d, i) {
    var color, label, ci = -1;
    if (PROVINCE_MODE) {
      color = provColor[d.province || '未知'] || '#888';
      label = d.province || '未知';
    } else {
      ci = groups.clusterOf[i];
      color = colorOf[ci];
      label = groups.labels[ci].join('、');
    }
    return {
      name: d.name,
      value: d.value,
      birds: d.birds,
      dates: d.dates || '',
      province: d.province || '',
      city: d.city || '',
      isRegion: false,
      clusterIdx: ci,
      groupColor: color,
      groupLabel: label,
      symbol: 'circle',
      symbolSize: symbolSize(d.value[2]) * SIZE_FACTOR,
      itemStyle: {
        color: color,
        borderColor: '#fff',
        borderWidth: 1.5,
        shadowBlur: 6,
        shadowColor: 'rgba(0,0,0,0.4)'
      },
      label: {
        show: showLabels,
        formatter: d.value[2],
        position: 'right',
        fontSize: 10,
        color: '#fff',
        fontWeight: 'bold',
        textBorderColor: '#000',
        textBorderWidth: 2
      }
    };
  });

  var chart = echarts.init(document.getElementById('map'));

  var option = {
    tooltip: { show: false },
    amap: {
      center: [114.0579, 22.5431],
      zoom: 10,
      viewMode: '2D',
      resizeEnable: true,
      mapStyle: 'amap://styles/normal',
      renderOnMoving: true,
      echartsLayerZIndex: 2019
    },
    series: [{
      type: 'scatter',
      coordinateSystem: 'amap',
      data: rendered,
      emphasis: { scale: 1.15 }
    }]
  };

  chart.setOption(option);

  var amap = chart.getModel().getComponent('amap').getAMap();
  var satellite = new AMap.TileLayer.Satellite();
  amap.add(satellite);
  amap.addControl(new AMap.Scale());
  amap.addControl(new AMap.ToolBar());
  // 缩放时按新鸟种数分级显示
  amap.on('zoomend', function() { refreshSeries(amap.getZoom()); });

  // ---- 图例 ----
  var legendEl = document.getElementById('groupLegend');
  var colorLbl = document.getElementById('colorLbl');
  var legendHtml = '';
  if (PROVINCE_MODE) {
    colorLbl.textContent = '颜色 = 省份';
    provList.forEach(function(p) {
      legendHtml += '<div class="grow" title="' + p + ' · ' + provCount[p] + ' 点">' +
        '<i style="background:' + provColor[p] + '"></i>' + p + '·' + provCount[p] + '点</div>';
    });
  } else {
    colorLbl.textContent = '颜色 = 鸟种相似组';
    order.forEach(function(o, idx) {
      var c = groups.clusters[o.i];
      var label = groups.labels[o.i].join('、');
      legendHtml += '<div class="grow" title="组' + (idx + 1) + ' · ' + c.members.length + ' 点 · 代表：' + label + '">' +
        '<i style="background:' + colorOf[o.i] + '"></i>组' + (idx + 1) + '·' + c.members.length + '点·' + label +
        '</div>';
    });
  }
  legendEl.innerHTML = legendHtml;

  // ---- 位置选择 ----
  var selProv = document.getElementById('selProv');
  var selCity = document.getElementById('selCity');
  var pickInfo = document.getElementById('pickInfo');

  function zoomForSpan(span) {
    if (span <= 0) return 13;
    if (span < 0.05) return 13;
    if (span < 0.2) return 12;
    if (span < 1.0) return 11;
    if (span < 3.0) return 10;
    if (span < 10.0) return 8;
    if (span < 30.0) return 6;
    if (span < 80.0) return 5;
    return 4;
  }

  // 当前区域筛出的点位（未做缩放过滤）
  var currentList = [];

  // 缩放级别 → 只显示「新鸟种数 >= 阈值」的点
  //   全国(<6)：>=10；省(6~7)：>=5；市(8~9)：>=2；区/街道(>=10)：全部
  function zoomThreshold(zoom) {
    if (zoom >= 10) return 0;
    if (zoom >= 8) return 2;
    if (zoom >= 6) return 5;
    return 10;
  }

  function refreshSeries(zoom) {
    if (zoom === undefined || zoom === null) zoom = amap.getZoom();
    var th = zoomThreshold(zoom);
    var list = currentList.filter(function(d) { return d.value[2] >= th; });
    // 严格按阈值；只有完全空白时才逐级降，避免页面全空
    while (!list.length && th > 0) {
      th -= 1;
      list = currentList.filter(function(d) { return d.value[2] >= th; });
    }
    chart.setOption({ series: [{ data: list }] });
    pickInfo.textContent = (list.length === currentList.length)
      ? (list.length + ' 点')
      : (list.length + ' / ' + currentList.length + ' 点');
  }

  function applyFilter(keepView) {
    var prov = selProv.value, city = selCity.value;
    currentList = rendered.filter(function(d) {
      if (prov && d.province !== prov) return false;
      if (city && d.city !== city) return false;
      return true;
    });
    var opt = { series: [{ data: currentList }] };
    var targetZoom = amap.getZoom();
    if (!keepView) {
      var center = [114.0579, 22.5431];
      var zoom = 10;
      if (currentList.length) {
        var lngs = currentList.map(function(d) { return d.value[0]; });
        var lats = currentList.map(function(d) { return d.value[1]; });
        var minLng = Math.min.apply(null, lngs), maxLng = Math.max.apply(null, lngs);
        var minLat = Math.min.apply(null, lats), maxLat = Math.max.apply(null, lats);
        center = [(minLng + maxLng) / 2, (minLat + maxLat) / 2];
        zoom = zoomForSpan(Math.max(maxLng - minLng, maxLat - minLat));
      }
      opt.amap = { center: center, zoom: zoom };
      targetZoom = zoom;
    }
    chart.setOption(opt);
    refreshSeries(targetZoom);
  }

  function populateCities() {
    var prov = selProv.value;
    selCity.innerHTML = '';
    selCity.value = '';
    var all = document.createElement('option');
    all.value = ''; all.textContent = '全部城市';
    selCity.appendChild(all);
    var cities = {};
    rendered.forEach(function(d) {
      if (prov && d.province !== prov) return;
      if (d.city) cities[d.city] = (cities[d.city] || 0) + 1;
    });
    Object.keys(cities).sort().forEach(function(name) {
      var o = document.createElement('option');
      o.value = name; o.textContent = name + '（' + cities[name] + '）';
      selCity.appendChild(o);
    });
  }

  var optAll = document.createElement('option');
  optAll.value = ''; optAll.textContent = '全国';
  selProv.appendChild(optAll);
  var provNames = {};
  rendered.forEach(function(d) { if (d.province) provNames[d.province] = (provNames[d.province] || 0) + 1; });
  Object.keys(provNames).sort().forEach(function(p) {
    var o = document.createElement('option');
    o.value = p; o.textContent = p + '（' + provNames[p] + '）';
    selProv.appendChild(o);
  });

  selProv.addEventListener('change', function() {
    populateCities();
    applyFilter(false);
  });
  selCity.addEventListener('change', function() { applyFilter(false); });
  populateCities();

  // 初始筛选：配置了默认城市且数据里存在 → 选它；否则全国 + 默认视野（深圳）
  var defaultHit = null;
  if (DEFAULT_CITY) {
    rendered.forEach(function(d) { if (d.city === DEFAULT_CITY) defaultHit = d; });
  }
  if (defaultHit) {
    if (defaultHit.province) {
      selProv.value = defaultHit.province;
      populateCities();
    } else if (DEFAULT_PROV) {
      selProv.value = DEFAULT_PROV;
      populateCities();
    }
    selCity.value = DEFAULT_CITY;
    applyFilter(false);
  } else {
    applyFilter(true);
  }

  // ---- 面板 ----
  var panel = document.getElementById('birdPanel');
  var panelTitle = document.getElementById('panelTitle');
  var panelMeta = document.getElementById('panelMeta');
  var panelBirds = document.getElementById('panelBirds');

  function showPanel(d) {
    var typeBadge = '<span class="panel-type type-point">具体点位</span>';
    panelTitle.innerHTML = d.name + typeBadge;

    panelMeta.innerHTML =
      '共 ' + d.value[2] + ' 种新鸟，' + d.value[3] + ' 种关注' +
      (d.dates ? '<br/>记录时间：' + d.dates : '') +
      '<br/><span style="color:' + d.groupColor + ';font-size:14px;">●</span> ' +
      (PROVINCE_MODE ? '省份：' : '鸟种相似组：') + d.groupLabel;

    var list = d.birds ? d.birds.split(',') : [];
    panelBirds.innerHTML = list.map(function(b) {
      var name = b.replace('⭐', '');
      var isFocus = b.indexOf('⭐') > -1;
      return '<span class="tag' + (isFocus ? ' focus' : '') + '">' + (isFocus ? '⭐ ' : '') + name + '</span>';
    }).join('');

    panel.style.display = 'block';
  }

  function closePanel() { panel.style.display = 'none'; }

  chart.on('click', function(p) {
    if (p.componentType === 'series' && p.data) {
      chart.dispatchAction({ type: 'hideTip' });
      showPanel(p.data);
    }
  });

  chart.getZr().on('click', function(e) {
    if (!e.target) closePanel();
  });

  var closeBtn = document.getElementById('panelClose');
  closeBtn.addEventListener('click', function(e) {
    e.stopPropagation(); e.preventDefault(); closePanel();
  }, false);
  closeBtn.addEventListener('touchstart', function(e) {
    e.stopPropagation(); e.preventDefault(); closePanel();
  }, { passive: false });

  panel.addEventListener('click', function(e) { e.stopPropagation(); });

  window.addEventListener('resize', function() { chart.resize(); });
}
tryStart();
</script>
</body>
</html>
