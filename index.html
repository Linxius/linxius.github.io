  function ymdLocal(dt) {

  function computeComplement(list) {

    if (zoom === undefined || zoom === null) zoom = amap.getZoom();
    var th = zoomThreshold(zoom);
    var list = currentStyled.filter(function(d) { return d.value[2] >= th; });
    while (!list.length && th > 0) {
      th -= 1;
      list = currentStyled.filter(function(d) { return d.value[2] >= th; });
    }
    // 全国视图整体缩小；省/市视图保持固定大小
    var sizeScale = zoom < 6 ? 0.55 : 1;
    if (sizeScale !== 1) {
      list = list.map(function(d) {
        var item = {};
        for (var k in d) { item[k] = d[k]; }
        item.symbolSize = d.symbolSize * sizeScale;
        return item;
      });
    }
    chart.setOption({ series: [{ data: list }] });
    var count = (list.length === currentList.length)
      ? (list.length + ' 点')
      : (list.length + ' / ' + currentList.length + ' 点');
    pickInfo.textContent = count + ' · 数字=市内补点顺序';
  }

  function populateBirds(region) {
    var keep = selBird.value;
    var counts = {};
    region.forEach(function(d) {
      uniqSpecies(d).forEach(function(k) { counts[k] = (counts[k] || 0) + 1; });
    });
    var names = Object.keys(counts).sort(function(a, b) {
      return counts[b] - counts[a] || a.localeCompare(b);
    });
    selBird.innerHTML = '';
    var all = document.createElement('option');
    all.value = ''; all.textContent = '全部鸟种';
    selBird.appendChild(all);
    names.forEach(function(n) {
      var o = document.createElement('option');
      o.value = n; o.textContent = n + '（' + counts[n] + '）';
      selBird.appendChild(o);
    });
    selBird.value = (keep && counts[keep]) ? keep : '';
  }

  function applyFilter(keepView) {
    var prov = selProv.value, city = selCity.value;
    var days = parseInt(selDays.value, 10) || 7;
    var cutoff = cutoffForDays(days);
    var region = [];
    rendered.forEach(function(d) {
      if (prov && d.province !== prov) return;
      if (city && d.city !== city) return;
      var v = windowView(d, cutoff);
      if (v) region.push(v);
    });
    populateBirds(region);
    var bird = selBird.value;
    currentList = bird
      ? region.filter(function(d) { return uniqSpecies(d).indexOf(bird) > -1; })
      : region;
    computeComplement(currentList);
    currentStyled = styleList(currentList);
    renderRankPanel();

    var opt = { series: [{ data: currentStyled }] };
    var targetZoom = amap.getZoom();
    if (!keepView) {
      var center = [114.0579, 22.5431];
      var zoom = 10;
      if (currentList.length) {
        var lngs = currentList.map(function(d) { return d.value[0]; });
        var lats = currentList.map(function(d) { return d.value[1]; });
        var minLng = Math.min.apply(null, lngs), maxLng = Math.max.apply(null, lngs);
        var minLat = Math.min.apply(null, lats), maxLat = Math.max.apply(null, lats);
        center = [(minLng + maxLng) / 2, (minLat + maxLat) / 2];
        zoom = zoomForSpan(Math.max(maxLng - minLng, maxLat - minLat));
      }
      opt.amap = { center: center, zoom: zoom };
      targetZoom = zoom;
    }
    chart.setOption(opt);
    refreshSeries(targetZoom);
  }

  function populateCities() {
    var prov = selProv.value;
    selCity.innerHTML = '';
    selCity.value = '';
    var all = document.createElement('option');
    all.value = ''; all.textContent = '全部城市';
    selCity.appendChild(all);
    var cities = {};
    rendered.forEach(function(d) {
      if (prov && d.province !== prov) return;
      if (d.city) cities[d.city] = (cities[d.city] || 0) + 1;
    });
    Object.keys(cities).sort().forEach(function(name) {
      var o = document.createElement('option');
      o.value = name; o.textContent = name + '（' + cities[name] + '）';
      selCity.appendChild(o);
    });
  }

  var optAll = document.createElement('option');
  optAll.value = ''; optAll.textContent = '全国';
  selProv.appendChild(optAll);
  var provNames = {};
  rendered.forEach(function(d) { if (d.province) provNames[d.province] = (provNames[d.province] || 0) + 1; });
  Object.keys(provNames).sort().forEach(function(p) {
    var o = document.createElement('option');
    o.value = p; o.textContent = p + '（' + provNames[p] + '）';
    selProv.appendChild(o);
  });

  selProv.addEventListener('change', function() {
    populateCities();
    applyFilter(false);
  });
  selCity.addEventListener('change', function() { applyFilter(false); });
  selBird.addEventListener('change', function() { applyFilter(true); });
  selDays.addEventListener('change', function() {
    try { localStorage.setItem('birdmap_days', selDays.value); } catch (e) {}
    applyFilter(true);
  });
  populateCities();

  var defaultHit = null;
  if (DEFAULT_CITY) {
    rendered.forEach(function(d) { if (d.city === DEFAULT_CITY) defaultHit = d; });
  }
  if (defaultHit) {
    if (defaultHit.province) {
      selProv.value = defaultHit.province;
      populateCities();
    } else if (DEFAULT_PROV) {
      selProv.value = DEFAULT_PROV;
      populateCities();
    }
    selCity.value = DEFAULT_CITY;
    applyFilter(false);
  } else {
    applyFilter(true);
  }

  amap.on('zoomend', function() { refreshSeries(amap.getZoom()); });

  // ---- 面板 ----
  var panel = document.getElementById('birdPanel');
  var panelTitle = document.getElementById('panelTitle');
  var panelMeta = document.getElementById('panelMeta');
  var panelBirds = document.getElementById('panelBirds');

  function showPanel(d) {
    panelTitle.innerHTML = d.name + '<span class="panel-type type-point">具体点位</span>';

    var meta = '共 ' + d.value[2] + ' 种新鸟，' + d.value[3] + ' 种关注';
    meta += '<br/>独有鸟种：' + (d.uniqueCount || 0) + ' 种';
    if (d.coverRank) {
      meta += '<br/>市内补点优先级：第 ' + d.coverRank + ' 位（新增 ' + d.coverGain + ' 种）';
    }
    if (d.dates) meta += '<br/>记录时间：' + d.dates;
    meta += '<br/><span style="color:' + d.groupColor + ';font-size:14px;">●</span> ' +
            '颜色档位：' + NOVELTY_BUCKETS[d.noveltyBucket || 0].label +
            ' · 省份：' + (d.province || '未知');
    panelMeta.innerHTML = meta;

    var uniqueSet = {};
    (d.uniqueBirds || []).forEach(function(n) { uniqueSet[n] = 1; });
    var list = d.birds ? d.birds.split(',') : [];
    panelBirds.innerHTML = list.map(function(b) {
      var name = b.replace('⭐', '');
      var isFocus = b.indexOf('⭐') > -1;
      var isUnique = !!uniqueSet[name];
      var cls = 'tag' + (isFocus ? ' focus' : '') + (isUnique ? ' unique' : '');
      var tip = isUnique ? '同城内只有该点记录到' : (isFocus ? '新鸟或关注鸟' : '已见鸟');
      return '<span class="' + cls + '" title="' + tip + '">' +
             (isFocus ? '⭐ ' : '') + (isUnique ? '◆ ' : '') + name + '</span>';
    }).join('');

    panel.style.display = 'block';
  }

  function closePanel() { panel.style.display = 'none'; }

  chart.on('click', function(p) {
    if (p.componentType === 'series' && p.data) {
      chart.dispatchAction({ type: 'hideTip' });
      showPanel(p.data);
    }
  });

  chart.getZr().on('click', function(e) {
    if (!e.target) closePanel();
  });

  var closeBtn = document.getElementById('panelClose');
  closeBtn.addEventListener('click', function(e) {
    e.stopPropagation(); e.preventDefault(); closePanel();
  }, false);
  closeBtn.addEventListener('touchstart', function(e) {
    e.stopPropagation(); e.preventDefault(); closePanel();
  }, { passive: false });

  panel.addEventListener('click', function(e) { e.stopPropagation(); });

  rankList.addEventListener('click', function(e) {
    var node = e.target;
    while (node && node !== rankList && !(node.dataset && node.dataset.name)) {
      node = node.parentNode;
    }
    if (!node || node === rankList || !node.dataset) return;
    var target = null;
    for (var i = 0; i < currentStyled.length; i++) {
      if (currentStyled[i].name === node.dataset.name) { target = currentStyled[i]; break; }
    }
    if (!target) return;
    chart.setOption({ amap: { center: [target.value[0], target.value[1]],
                              zoom: Math.max(amap.getZoom(), 12) } });
    showPanel(target);
  });

  btnRank.addEventListener('click', function() {
    rankPanel.style.display = (rankPanel.style.display === 'block') ? 'none' : 'block';
  });
  document.getElementById('rankClose').addEventListener('click', function() {
    rankPanel.style.display = 'none';
  });

  window.addEventListener('resize', function() { chart.resize(); });
}
tryStart();
</script>
</body>
</html>
